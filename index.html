<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>instrument</title>
    <!-- <link rel="stylesheet" href="style.css"> -->
    <!-- <script src="script.js"></script> -->
  </head>
  <body>
    <div class="instrument">
      <div>
      <label for="instrument">instrument</label>
      </div>

      <div>
      <button class="mute" data-muted="false">Mute</button>
      </div>
      <div class="notes">
        <div
          id="note1"
          style="border: 2px solid black;" >
          <div>
          <label for="note1">note1</label>
          </div>
          <label for="note1_hz">note1 hz</label>
          <input
              name="note1_hz"
              id="note1_hz"
              type="range"
              min="20"
              max="10000"
              step="0.01"
              value="1000" />
          <label for="note1_amp">note1 amp</label>
          <input
              name="note1_amp"
              id="note1_amp"
              type="range"
              min="0.0"
              max="1.0"
              step="0.01"
              value="0.5" />
        </div>
        <div
          id="note2"
